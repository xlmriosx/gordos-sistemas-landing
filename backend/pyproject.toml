[project]
name = "app-handler"
version = "0.0.1"
description = "Python handler for the app — serves /healthz, /api/*, and the built frontend SPA."
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115,<1",
    # `spa.py` imports Starlette directly (not just transitively via
    # fastapi[standard]) — declared explicitly rather than relied on.
    "starlette>=0.40,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "ruff>=0.6",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Top-level package is `app_handler` — service-descriptive rather than a
# bare `handler`/`app`, so it won't collide if this ever sits in a workspace
# alongside other services.
packages = ["src/app_handler"]
